<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador</title>
    <script src="https://kit.fontawesome.com/ac52fd1507.js" crossorigin="anonymous"></script>
    <style>
        * {
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-color: rgb(76, 83, 83);
            color: white;
            font: normal 1em arial;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 60vw;
            max-width: 400px;
            height: 40vh;
            background-color: rgb(156, 172, 177);
            border-radius: 10px;
            box-shadow: rgba(0, 0, 0, 0.377) 5px 5px 5px;

            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        h1 {
            text-align: center;
            text-shadow: rgba(0, 0, 0, 0.226) 2px 2px 2px;
        }

        button {
            background-color: transparent;
            border: none;
            font-size: 4em;
            color: white
        }

        span {
            font-size: 5em;
        }

        .bot {
            cursor: pointer;
            transition: all .3s ease;
        }

        .bot:hover {
            transform: scale(1.1);
            text-shadow: rgba(0, 0, 0, 0.226) 2px 2px 2px;
        }

        #num {
            transition: all 1s ease;
        }

        button:disabled, button:disabled:hover {
            opacity: .5;
            cursor: unset;
            transform: scale(1);
            text-shadow: none;
        }
    </style>
</head>
<body>
    <h1>Contado de Numeros</h1>
    <div class="container">
        <div class="fuck">
            <button id="ant" class="bot">
                <i class="fa-solid fa-caret-left"></i>
            </button>
            <span id="num">0</span>
            <button id="pro" class="bot">
                <i class="fa-solid fa-caret-right"></i>
            </button>
        </div>

        <button id="zer" class="bot">
            <i class="fa-solid fa-square"></i>
        </button>
    </div>
</body>
    <script>
        let ant = document.getElementById('ant')
        let num = document.getElementById('num')
        let pro = document.getElementById('pro')
        let zer = document.getElementById('zer')

        let getNum = () => Number(num.innerText) //cria uma função para pegar o valor

        function animar() {
            num.style.transform = 'scale(1.5)'

        setTimeout(() => { //animação de pulsar no js
            num.style.transform = 'scale(1)'
        }, 200) 
        }

        function verificar() {
            if(getNum() === 0){
                zer.disabled = true
            } else {
                zer.disabled = false
            }
        }

        ant.onclick = () => {
            num.innerText = getNum() - 1
            animar()
            verificar()
        } 

        pro.onclick = () => {
            num.innerText = getNum() + 1 
            animar()
            verificar()
        }

        zer.onclick = () => {
            num.innerText = 0 
            animar()
            verificar()
        }


        verificar()
    </script>
</html>
