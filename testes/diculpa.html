<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diculpa</title>
    <script src="https://kit.fontawesome.com/ac52fd1507.js" crossorigin="anonymous"></script>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body {
            font: normal 1em arial;
            height: 100vh;
            background-image: linear-gradient(to right, #E4D6FF, #CDE5FF);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        main {
            font-size: .8em;

            background-color: white;
            width: 300px;
            height: 400px;
            padding: 20px;
            border-radius: 20px;

            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        img {
            width: 150px;
            border-radius: 40px;
        }

        .botoes {
            padding-top: 20px;

            display: flex;
            justify-content: center;
            gap: 40px;
        }

        .botao {
            color: white;
            background-color: #87c1ff;
            padding: 15px;
            font-weight: bolder;
            border: none;
            border-radius: 10px;
            box-shadow: 0px 5px gray;

            transition: all .3s ease;
        }

        .botao:hover {
            transform: scale(1.05);
            background-color: #77b6fa;
            cursor: pointer;
        }

        .botao:active {
            box-shadow: none;
            transform: translateY(5px);
        }
    </style>
</head>
<body>
    <main>
        <img src="https://altoastral.joaobidu.com.br/antigas/uploads/legacy/2016/07/AAT001-P001-89335-1-m-Divulgacao_1.jpg" alt="">
        <h1 id="txt">ME DESCULPA NENEM?</h1>
        <div class="botoes">
            <button class="botao" id="sim">SIM <i class="fa-solid fa-heart"></i></button>
            <button class="botao" id="nao">NÃO <i class="fa-solid fa-heart-crack"></i></button>
        </div>
    </main>
    <script>
        const sim = document.getElementById('sim')
        const nao = document.getElementById('nao')
        const txt = document.getElementById('txt')

        sim.addEventListener('click', () => {
            txt.innerText = 'EU TO COM MUITO SONO PRA PENSAR EM ALGUMA COISA FOFINHA, MAS EU TE AMO!'
        })
        nao.addEventListener('click', () => {
            txt.innerText = 'EU TE AMO MESMO ASSIM!'
        })
    </script>
</body>
</html>
